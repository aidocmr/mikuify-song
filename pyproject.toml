[project]
name = "mikuifysong"
version = "0.1.0"
description = "Turn any song into a Hatsune Miku cover using StemSplitio HT-Demucs ONNX and NoCrypt Miku RVC"
requires-python = ">=3.11,<3.13"
dependencies = [
    "audio-separator>=0.14.3,<0.15",
    "demucs-onnx>=0.3.4",
    "gradio>=6.32.0",
    "infer-rvc-python>=1.3.1",
    "setuptools<81",
]
